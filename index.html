<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>무명</title>
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="무명">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="lock" class="screen auth" hidden>
    <div class="auth-box">
      <header class="auth-header">
        <h1 class="logo">무명</h1>
      </header>
      <form id="lockForm" autocomplete="off">
        <label for="pass">암호</label>
        <input id="pass" type="password" inputmode="numeric" maxlength="32" autocomplete="current-password" required>
        <button class="btn primary wide" type="submit">열기</button>
      </form>
      <p id="lockErr" class="err small" role="alert"></p>
    </div>
  </section>

  <section id="onboard" class="screen auth" hidden>
    <div class="auth-box">
      <header class="auth-header">
        <h1 class="logo">무명</h1>
      </header>
      <form id="startForm" class="auth-form">
        <label for="codename">이름</label>
        <input id="codename" maxlength="12" value="한윤서" autocomplete="off" required>
        <button id="startBtn" class="btn primary wide" type="submit">시작</button>
      </form>
      <p id="onbErr" class="err small" role="alert"></p>
      <details class="rules">
        <summary>이용 규칙</summary>
        <ul>
          <li>실명·얼굴·연락처·직장 이름은 묻지도 말하지도 않아요.</li>
          <li>편지는 하루에 한 통 보낼 수 있어요. 다음 날 정오에 도착해요.</li>
          <li>30일째 밤, 두 사람 모두 원하면 이름을 교환해요.</li>
        </ul>
      </details>
    </div>
  </section>

  <section id="app" class="screen" hidden>
    <div class="journal">
      <aside class="journal-sidebar">
        <div class="journal-brand">무명</div>
        <nav class="journal-nav" aria-label="무명 메뉴">
          <button class="nav-item" type="button" data-view="chat" aria-current="page">대화</button>
          <button class="nav-item" type="button" data-view="letters">
            편지함<span id="letterBadge" class="nav-unread" aria-hidden="true" hidden></span>
          </button>
          <button id="diaryTab" class="nav-item" type="button" data-view="diary" hidden>일기</button>
          <button class="nav-item" type="button" data-view="settings">정보</button>
        </nav>
        <div id="sidebarProgress" class="sidebar-progress" hidden>
          <div class="days-text"><span id="sidebarDay"></span><span>30일</span></div>
          <div class="days-bar" aria-hidden="true"><i id="sidebarBar"></i></div>
        </div>
      </aside>

      <main class="journal-content">
        <section id="chatView" class="view chat-view" aria-label="대화">
          <header class="top">
            <div class="who">
              <span class="av" data-av aria-hidden="true"></span>
              <span class="who-text">
                <span id="hisName" class="name">이도현</span>
                <span class="sub"><span id="presence"></span><span id="status"></span></span>
              </span>
            </div>
            <span id="dday" class="dday"></span>
          </header>
          <div id="aiBanner" class="banner" role="status" hidden>AI 키를 연결하면 답장이 와요.</div>
          <div class="chat-stream">
            <div id="chat" class="pane" tabindex="0" aria-label="메시지 기록">
              <div id="msgs" class="msgs"></div>
              <div id="typing" class="row-msg him last typing-row" hidden>
                <span class="mini av" data-av aria-hidden="true"></span>
                <div class="typing" role="status" aria-label="답장을 쓰고 있어요"><span></span><span></span><span></span></div>
              </div>
            </div>
            <button id="jumpLatest" class="icon jump-latest" type="button" aria-label="최근 메시지" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m-6-6 6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <footer id="composer" class="composer">
            <div class="field">
              <button id="photoBtn" class="icon tool" type="button" aria-label="사진 보내기" data-live>
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="9.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 17l4.5-4.5 3.5 3.5 2.5-2.5 5.5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
              </button>
              <input id="photoInput" type="file" accept="image/*" hidden>
              <textarea id="input" rows="1" aria-label="메시지" placeholder="메시지"></textarea>
              <button id="sendBtn" class="send" type="button" aria-label="보내기" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </footer>
        </section>

        <section id="letters" class="view page" aria-labelledby="lettersTitle" hidden>
          <header class="page-top">
            <h2 id="lettersTitle">편지함</h2>
            <button id="writeBtn" class="btn small primary" type="button">편지 쓰기</button>
          </header>
          <div class="page-body" tabindex="0" aria-label="편지 목록">
            <p id="writeStatus" class="write-status" role="status" hidden></p>
            <div id="letterList" class="letter-list"></div>
          </div>
        </section>

        <section id="diary" class="view page" aria-labelledby="diaryTitle" hidden>
          <header class="page-top"><h2 id="diaryTitle">이도현의 일기</h2></header>
          <div class="page-body" tabindex="0" aria-label="일기 목록"><div id="diaryList" class="diary-list"></div></div>
        </section>

        <section id="settings" class="view page" aria-labelledby="settingsTitle" hidden>
          <header class="page-top"><h2 id="settingsTitle">정보</h2></header>
          <div class="page-body settings-body">
            <div class="profile">
              <span class="av" data-av aria-hidden="true"></span>
              <div class="profile-text">
                <div id="infoName" class="p-name">이도현</div>
                <div id="infoStatus" class="p-sub"></div>
              </div>
              <div id="profileProgress" class="days">
                <div class="days-text"><span id="dayText"></span><span>30일</span></div>
                <div class="days-bar" aria-hidden="true"><i id="dayBar"></i></div>
              </div>
            </div>

            <h3 class="group-label">나</h3>
            <div class="group">
              <div class="cell"><span>내 이름</span><span id="myName" class="muted"></span></div>
            </div>

            <h3 class="group-label" data-live>알림</h3>
            <div class="group" data-live>
              <div class="cell col">
                <div class="between"><span>푸시 알림</span><button id="pushBtn" class="btn small primary" type="button">알림 켜기</button></div>
                <p id="pushHelp" class="small muted"></p>
              </div>
              <div class="cell"><span>알림 테스트</span><button id="pushTest" class="btn small" type="button">보내보기</button></div>
            </div>

            <div class="group" data-live>
              <button id="logout" class="cell lock-button" type="button">잠그기</button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </section>

  <div id="paper" class="sheet" hidden>
    <section class="paper-sheet" role="dialog" aria-modal="true" aria-labelledby="paperTitle">
      <div class="sheet-top">
        <button id="paperClose" class="icon back" type="button" aria-label="편지 닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <h2 id="paperTitle" class="sheet-title"></h2>
        <button id="paperSend" class="btn small primary" type="button" hidden>보내기</button>
      </div>
      <article id="paperRead" class="paper" tabindex="0"></article>
      <div id="paperWriteWrap" class="paper-write" hidden>
        <textarea id="paperWrite" class="paper" aria-label="편지 본문" placeholder="편지 본문"></textarea>
        <div class="paper-footer"><span>내일 정오에 도착해요</span><span id="paperCount"></span></div>
      </div>
    </section>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalText">
      <p id="modalText"></p>
      <div id="modalBtns" class="modal-btns"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
